name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions for this public repository.
permissions:
  contents: read

# Never let two production syncs race each other.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build

      # Primary deploys: pull-deploy.timer on Caddy VM (.177) via /srv/deploy.
      # SSH steps below are manual fallback only.
      - name: Load deploy key
        if: github.event_name == 'workflow_dispatch'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust Caddy host key
        if: github.event_name == 'workflow_dispatch'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Caddy VM
        if: github.event_name == 'workflow_dispatch'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: rsync -av --delete dist/ "root@$VPS_HOST:/srv/sites/jarrettwilliams.com/public/"
