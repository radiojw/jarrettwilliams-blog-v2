# Temporary: create the analytics.whatisthisplace.org A record via the
# Cloudflare API token stored in this repo's secrets. Remove after use.
name: DNS Analytics Record

on:
  workflow_dispatch:

permissions: {}

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create A record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zone=$(curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=whatisthisplace.org" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0]["id"] if r else "NOZONE"); print(json.dumps(d.get("errors")), file=sys.stderr)')
          echo "zone=$zone"
          if [ "$zone" = "NOZONE" ]; then echo "TOKEN_CANNOT_SEE_ZONE"; exit 1; fi
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" \
            --data '{"type":"A","name":"analytics.whatisthisplace.org","content":"40.160.227.26","ttl":300,"proxied":false,"comment":"Umami dashboard on lax1"}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success")); print("errors:", d.get("errors"))'
